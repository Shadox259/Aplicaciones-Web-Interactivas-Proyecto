; Ajustes de PHP para Library of Wonderland (subida de PDF de hasta 30 MB)
upload_max_filesize = 64M
post_max_size = 70M
memory_limit = 256M
max_execution_time = 120
date.timezone = America/Mexico_City
expose_php = Off

; Rendimiento (la aplicacion va dentro de la imagen y no cambia en tiempo de ejecucion)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
